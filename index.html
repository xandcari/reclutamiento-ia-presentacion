<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reclutamiento IA — selección ágil, explicable y humana</title>
  <meta name="description" content="Reclutamiento IA: postulación por chat, evaluación explicable, informes para el cliente y agenda de entrevistas para gastronomía, hotelería y turismo.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0F2540">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Reclutamiento IA">
  <meta property="og:description" content="Selección ágil, explicable y humana.">
  <script>/* tema inicial antes de pintar: el guardado por la persona o, la primera vez, claro */
    try { var t = localStorage.getItem("ri-theme"); document.documentElement.setAttribute("data-theme", ["light", "dark", "rose", "cream"].indexOf(t) > -1 ? t : "light"); } catch (e) {}
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F2540'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' font-weight='700' text-anchor='middle' fill='%23C9E86B'%3ERI%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="assets/fonts/pjs-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="producto.css">
</head>
<body>
  <a class="skip" href="#main" data-i18n="ui.skip">Ir al contenido</a>

  <div class="app" id="app">
    <!-- ═════════ BARRA LATERAL ═════════ -->
    <aside class="rail" id="rail" aria-label="Navegación">
      <div class="rail-top">
        <button type="button" class="rail-toggle" id="railToggle" aria-expanded="false" aria-controls="rail" aria-label="Menú" data-i18n-attr="aria-label:ui.menu">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <a class="rail-brand" href="#home" aria-label="Reclutamiento IA"><span class="brand-mark" aria-hidden="true">RI</span><span class="rl-label">Reclutamiento IA</span></a>
      </div>

      <nav class="rail-nav" id="nav" aria-label="Principal">
        <a class="rail-link" href="#home" data-view="home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
          <span class="rl-label" data-i18n="nav.home">Inicio</span>
        </a>
        <a class="rail-link" href="#journey" data-view="journey">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M7 18h6a4 4 0 0 0 0-8h-2a4 4 0 0 1 0-8h6" transform="translate(0 2)"/></svg>
          <span class="rl-label" data-i18n="nav.journey">Recorrido</span>
        </a>
        <a class="rail-link" href="#panel" data-view="panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>
          <span class="rl-label" data-i18n="nav.panel">Panel y colores</span>
        </a>
        <a class="rail-link" href="#bot" data-view="bot">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5 4V6a1 1 0 0 1 1-1z"/></svg>
          <span class="rl-label" data-i18n="nav.bot">Bot y agenda</span>
        </a>
        <a class="rail-link" href="#ai" data-view="ai">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 17l.8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8z"/></svg>
          <span class="rl-label" data-i18n="nav.ai">IA y video</span>
        </a>
        <a class="rail-link" href="#report" data-view="report">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg>
          <span class="rl-label" data-i18n="nav.report">Informe y confianza</span>
        </a>
        <a class="rail-link" href="#roadmap" data-view="roadmap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
          <span class="rl-label" data-i18n="nav.roadmap">Hoja de ruta</span>
        </a>
        <a class="rail-link" href="#contact" data-view="contact">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <span class="rl-label" data-i18n="nav.contact">Contacto</span>
        </a>
      </nav>

      <div class="rail-bottom">
        <div class="lang" role="group" aria-label="Idioma" id="langSwitch">
          <button type="button" data-lang="es" aria-pressed="true">ES</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <button type="button" class="rail-link rail-theme" id="themeBtn" aria-label="Cambiar tema">
          <span class="sw sw-light" id="themeDot" aria-hidden="true"></span>
        </button>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <!-- ═════════ CONTENIDO ═════════ -->
    <div class="stage">
      <header class="topbar">
        <button type="button" class="rail-toggle" id="railOpen" aria-label="Menú" data-i18n-attr="aria-label:ui.menu">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <span class="brand-mark" aria-hidden="true">RI</span>
        <strong class="topbar-title">Reclutamiento IA</strong>
      </header>

      <main id="main" tabindex="-1">

        <!-- INICIO -->
        <section class="view" id="view-home" data-view="home" aria-labelledby="heroName">
          <div class="hero-grid">
            <div class="hero-copy">
              <p class="badge"><span class="dot" aria-hidden="true"></span><span data-i18n="hero.badge"></span></p>
              <p class="kicker" data-i18n="hero.kicker"></p>
              <h1 id="heroName">Reclutamiento IA</h1>
              <p class="role" data-i18n="hero.role"></p>
              <p class="tagline" data-i18n="hero.tagline"></p>
              <div class="cta-row">
                <a class="btn btn-primary" href="#journey" data-i18n="hero.cta1"></a>
                <a class="btn btn-ghost" href="#contact" data-i18n="hero.cta2"></a>
              </div>
            </div>
            <aside class="hero-card" aria-label="Indicadores">
              <ul class="stats" id="stats"></ul>
            </aside>
          </div>
          <ul class="tiles-nav" id="tilesNav" aria-label="Secciones"></ul>
        </section>

        <!-- RECORRIDO -->
        <section class="view" id="view-journey" data-view="journey" aria-labelledby="journeyTitle" hidden>
          <h2 class="section-title" id="journeyTitle" data-i18n="journey.title"></h2>
          <p class="section-intro" data-i18n="journey.intro"></p>
          <h3 class="subtitle" data-i18n="journey.problemTitle"></h3>
          <div class="project-grid" id="problemGrid"></div>
          <h3 class="subtitle" data-i18n="journey.solutionTitle"></h3>
          <div class="project-grid" id="stepGrid"></div>
          <p class="note" data-i18n="journey.note"></p>
        </section>

        <!-- PANEL Y COLORES -->
        <section class="view" id="view-panel" data-view="panel" aria-labelledby="panelTitle" hidden>
          <h2 class="section-title" id="panelTitle" data-i18n="panel.title"></h2>
          <p class="section-intro" data-i18n="panel.intro"></p>
          <p class="tag tag-maqueta" data-i18n="panel.tag"></p>
          <div class="mock" role="img" id="panelMock"></div>
          <h3 class="subtitle" data-i18n="panel.scaleTitle"></h3>
          <div class="scale-grid" id="scaleGrid"></div>
          <ul class="principles" id="principles"></ul>
        </section>

        <!-- BOT Y AGENDA -->
        <section class="view" id="view-bot" data-view="bot" aria-labelledby="botTitle" hidden>
          <h2 class="section-title" id="botTitle" data-i18n="bot.title"></h2>
          <p class="section-intro" data-i18n="bot.intro"></p>
          <p class="tag tag-hoy" data-i18n="bot.tag"></p>
          <div class="split">
            <div class="phone-mock" id="chatMock" role="img"></div>
            <ul class="points" id="botPoints"></ul>
          </div>
          <p class="note" data-i18n="bot.note"></p>
        </section>

        <!-- IA Y VIDEO -->
        <section class="view" id="view-ai" data-view="ai" aria-labelledby="aiTitle" hidden>
          <h2 class="section-title" id="aiTitle" data-i18n="ai.title"></h2>
          <p class="section-intro" data-i18n="ai.intro"></p>
          <div class="tabs" role="tablist" id="aiTabs">
            <button type="button" role="tab" class="tab" id="atab-ai" aria-controls="apanel-ai" aria-selected="true" data-tab="ai"></button>
            <button type="button" role="tab" class="tab" id="atab-video" aria-controls="apanel-video" aria-selected="false" data-tab="video"></button>
          </div>
          <div class="panel" id="apanel-ai" role="tabpanel" aria-labelledby="atab-ai">
            <p class="tag tag-ruta" data-i18n="ai.tag"></p>
            <div class="project-grid" id="aiGrid"></div>
            <div class="rules" id="aiRules"></div>
          </div>
          <div class="panel" id="apanel-video" role="tabpanel" aria-labelledby="atab-video" hidden>
            <p class="tag tag-ruta" data-i18n="video.tag"></p>
            <div class="split">
              <div class="phone-mock" id="videoMock" role="img"></div>
              <div>
                <ol class="steps" id="videoSteps"></ol>
                <div class="rules" id="videoRules"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- INFORME Y CONFIANZA -->
        <section class="view" id="view-report" data-view="report" aria-labelledby="reportTitle" hidden>
          <h2 class="section-title" id="reportTitle" data-i18n="report.title"></h2>
          <p class="section-intro" data-i18n="report.intro"></p>
          <p class="tag tag-hoy" data-i18n="report.tag"></p>
          <div class="split">
            <div class="report-mock" id="reportMock" role="img"></div>
            <ul class="points" id="reportPoints"></ul>
          </div>
          <h3 class="subtitle" data-i18n="trust.title"></h3>
          <div class="project-grid" id="trustGrid"></div>
          <p class="note" data-i18n="trust.note"></p>
        </section>

        <!-- HOJA DE RUTA -->
        <section class="view" id="view-roadmap" data-view="roadmap" aria-labelledby="roadmapTitle" hidden>
          <div class="dark-panel">
            <h2 class="section-title on-dark" id="roadmapTitle" data-i18n="roadmap.title"></h2>
            <p class="section-intro on-dark" data-i18n="roadmap.intro"></p>
            <div class="next-grid" id="phaseGrid"></div>
          </div>
          <h3 class="subtitle" data-i18n="plans.title"></h3>
          <p class="section-intro" data-i18n="plans.intro"></p>
          <div class="project-grid" id="planGrid"></div>
        </section>

        <!-- CONTACTO -->
        <section class="view" id="view-contact" data-view="contact" aria-labelledby="contactTitle" hidden>
          <div class="dark-panel contact-panel">
            <h2 class="section-title on-dark" id="contactTitle" data-i18n="contact.title"></h2>
            <p class="contact-lead" data-i18n="contact.lead"></p>
            <p class="mail-line"><span class="mail-text" id="mailText"></span><button type="button" class="copy-btn" id="copyMail" data-i18n="ui.copy">Copiar</button></p>
            <div class="cta-row">
              <a class="btn btn-accent" id="mailLink" href="#" data-i18n="contact.email"></a>
              <a class="btn btn-outline" id="inLink" href="#" target="_blank" rel="noopener" data-i18n="contact.linkedin"></a>
              <a class="btn btn-outline" id="ghLink" href="#" target="_blank" rel="noopener" data-i18n="contact.github"></a>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <p>© <span id="year"></span> Carina Alejandra Luna · <span data-i18n="footer"></span></p>
      </footer>
    </div>
  </div>

  <button type="button" class="to-top" id="toTop" aria-label="Volver arriba" data-i18n-attr="aria-label:ui.top" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <noscript><p style="padding:1rem;text-align:center">Reclutamiento IA — presentación del producto. Esta página necesita JavaScript.</p></noscript>

  <script>/* si un archivo del sitio no carga (falla pasajera de la red), se reintenta una sola vez */
    window.addEventListener("error", function (e) {
      try { if (e.target && e.target.tagName === "SCRIPT" && !sessionStorage.getItem("ri-reintento")) { sessionStorage.setItem("ri-reintento", "1"); setTimeout(function () { location.reload(); }, 1200); } } catch (x) {}
    }, true);
  </script>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
